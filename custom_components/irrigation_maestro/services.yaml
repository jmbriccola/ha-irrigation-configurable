# Field selectors only — names and descriptions live in translations
# ("services" section of translations/*.json).

run_zone:
  fields:
    zone_id:
      required: true
      example: 1b2f3c4d5e6f
      selector:
        text:
    duration:
      example: 15
      selector:
        number:
          min: 1
          max: 1440
          step: 1
          unit_of_measurement: min
          mode: box

run_all:

skip_today:
  fields:
    zone_id:
      example: 1b2f3c4d5e6f
      selector:
        text:

pause:
  fields:
    hours:
      required: true
      example: 6
      selector:
        number:
          min: 0.5
          max: 8760
          step: 0.5
          unit_of_measurement: h
          mode: box
    zone_id:
      example: 1b2f3c4d5e6f
      selector:
        text:

suspend_until:
  fields:
    until:
      required: true
      example: "2026-08-01 06:00:00"
      selector:
        datetime:
    zone_id:
      example: 1b2f3c4d5e6f
      selector:
        text:

resume:
  fields:
    zone_id:
      example: 1b2f3c4d5e6f
      selector:
        text:

stop_all:

evaluate:

set_zone_order:
  fields:
    zone_id:
      required: true
      example: 1b2f3c4d5e6f
      selector:
        text:
    order:
      required: true
      example: 10
      selector:
        number:
          min: 1
          max: 1000
          step: 1
          mode: box

set_curve:
  fields:
    zone_id:
      required: true
      example: 1b2f3c4d5e6f
      selector:
        text:
    cycle_id:
      required: true
      example: a1b2c3d4
      selector:
        text:
    points:
      required: true
      example: "[[10, 5], [25, 15], [35, 30]]"
      selector:
        object:
    min_value:
      example: 5
      selector:
        number:
          min: 0
          max: 10000
          step: 0.1
          mode: box
    max_value:
      example: 55
      selector:
        number:
          min: 0
          max: 10000
          step: 0.1
          mode: box
    kind:
      required: false
      example: duration
      selector:
        select:
          options:
            - duration
            - volume

export_config:

import_config:
  fields:
    payload:
      required: true
      example: '{"options": {}, "zones": {}}'
      selector:
        text:
          multiline: true

set_program_schedule:
  fields:
    zone_id:
      required: true
      example: 1b2f3c4d5e6f
      selector:
        text:
    program_id:
      required: true
      example: a1b2c3d4
      selector:
        text:
    calendar_mode:
      example: weekdays
      selector:
        select:
          options:
            - weekdays
            - interval
            - parity
    interval_days:
      example: 3
      selector:
        number:
          min: 1
          max: 60
          step: 1
          unit_of_measurement: days
          mode: box
    parity:
      example: odd
      selector:
        select:
          options:
            - odd
            - even
    season_months:
      example: "[6, 7, 8]"
      selector:
        select:
          multiple: true
          options:
            - value: "1"
              label: Jan
            - value: "2"
              label: Feb
            - value: "3"
              label: Mar
            - value: "4"
              label: Apr
            - value: "5"
              label: May
            - value: "6"
              label: Jun
            - value: "7"
              label: Jul
            - value: "8"
              label: Aug
            - value: "9"
              label: Sep
            - value: "10"
              label: Oct
            - value: "11"
              label: Nov
            - value: "12"
              label: Dec
    days:
      example: "[0, 2, 4]"
      selector:
        select:
          multiple: true
          options:
            - value: "0"
              label: Mon
            - value: "1"
              label: Tue
            - value: "2"
              label: Wed
            - value: "3"
              label: Thu
            - value: "4"
              label: Fri
            - value: "5"
              label: Sat
            - value: "6"
              label: Sun
    start_kind:
      required: true
      example: sun
      selector:
        select:
          options:
            - time
            - sun
    start_time:
      example: "06:00:00"
      selector:
        time:
    start_event:
      example: sunrise
      selector:
        select:
          options:
            - sunrise
            - sunset
    start_offset_min:
      example: -15
      selector:
        number:
          min: -360
          max: 360
          step: 1
          unit_of_measurement: min
          mode: box

set_program_minutes:
  fields:
    zone_id:
      required: true
      example: 1b2f3c4d5e6f
      selector:
        text:
    program_id:
      required: true
      example: a1b2c3d4
      selector:
        text:
    minutes:
      example: 15
      selector:
        number:
          min: 1
          max: 1440
          step: 1
          unit_of_measurement: min
          mode: box
    day_minutes:
      example: '{"0": 15, "2": 20}'
      selector:
        object:

add_program:
  fields:
    zone_id:
      required: true
      example: 1b2f3c4d5e6f
      selector:
        text:
    name:
      example: Morning
      selector:
        text:
    copy_from:
      example: a1b2c3d4
      selector:
        text:

duplicate_program:
  fields:
    zone_id:
      required: true
      example: 01J8ZQ
      selector:
        text:
    program_id:
      required: true
      example: a1b2c3d4
      selector:
        text:
    target_zone_id:
      required: false
      example: 01J8ZR
      selector:
        text:
    name:
      required: false
      example: Morning (copy)
      selector:
        text:

copy_curve:
  fields:
    source_zone_id:
      required: true
      example: 01J8ZQ
      selector:
        text:
    source_program_id:
      required: true
      example: a1b2c3d4
      selector:
        text:
    zone_id:
      required: true
      example: 01J8ZR
      selector:
        text:
    program_id:
      required: true
      example: e5f6a7b8
      selector:
        text:

remove_program:
  fields:
    zone_id:
      required: true
      example: 1b2f3c4d5e6f
      selector:
        text:
    program_id:
      required: true
      example: a1b2c3d4
      selector:
        text:

rename_program:
  fields:
    zone_id:
      required: true
      example: 1b2f3c4d5e6f
      selector:
        text:
    program_id:
      required: true
      example: a1b2c3d4
      selector:
        text:
    name:
      required: true
      example: Morning
      selector:
        text:

add_zone:
  fields:
    name:
      required: true
      example: Vegetable beds
      selector:
        text:
    valve_entity:
      required: true
      example: valve.garden_zone_1
      selector:
        entity:
          domain:
            - valve
            - switch
    area_m2:
      example: 12.5
      selector:
        number:
          min: 0
          step: 0.1
          unit_of_measurement: m²
          mode: box
    icon:
      example: mdi:sprinkler
      selector:
        icon:

update_zone:
  fields:
    zone_id:
      required: true
      example: 1b2f3c4d5e6f
      selector:
        text:
    name:
      example: Vegetable beds
      selector:
        text:
    valve_entity:
      example: valve.garden_zone_1
      selector:
        entity:
          domain:
            - valve
            - switch
    area_m2:
      example: 12.5
      selector:
        number:
          min: 0
          step: 0.1
          unit_of_measurement: m²
          mode: box
    icon:
      example: mdi:sprinkler
      selector:
        icon:
    flow_sensor:
      example: sensor.garden_zone_1_flow
      selector:
        entity:
          domain: sensor
    flow_sensor_unit:
      example: m³/h
      selector:
        select:
          options:
            - L/min
            - L/h
            - L/s
            - mL/s
            - m³/h
            - m³/min
            - m³/s
            - ft³/min
            - gal/h
            - gal/min
            - gal/d
    nominal_flow_lpm:
      example: 8
      selector:
        number:
          min: 0
          step: 0.1
          unit_of_measurement: L/min
          mode: box
    flow_tolerance_pct:
      example: 25
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: box
    leak_sensor:
      example: binary_sensor.garden_zone_1_leak
      selector:
        entity:
          domain: binary_sensor
          device_class: moisture
    water_supply_sensor:
      example: binary_sensor.garden_water_supply
      selector:
        entity:
          domain: binary_sensor
          device_class: problem
    adjustment_pct:
      example: 100
      selector:
        number:
          min: 10
          max: 300
          step: 1
          unit_of_measurement: "%"
          mode: box
    order:
      example: 100
      selector:
        number:
          min: 1
          max: 1000
          step: 1
          mode: box
    compatibility_group:
      example: drip
      selector:
        text:

remove_zone:
  fields:
    zone_id:
      required: true
      example: 1b2f3c4d5e6f
      selector:
        text:

set_weather_sources:
  fields:
    weather_entity:
      required: true
      example: weather.home
      selector:
        entity:
          domain: weather
    rain_sensor:
      example: sensor.rain_today
      selector:
        entity:
          domain: sensor
    outdoor_temp_sensor:
      example: sensor.outdoor_temperature
      selector:
        entity:
          domain: sensor
    line_flow_sensor:
      example: sensor.line_flow
      selector:
        entity:
          domain: sensor
    line_flow_sensor_unit:
      example: m³/h
      selector:
        select:
          options:
            - L/min
            - L/h
            - L/s
            - mL/s
            - m³/h
            - m³/min
            - m³/s
            - ft³/min
            - gal/h
            - gal/min
            - gal/d
    master_valve:
      example: switch.pump_relay
      selector:
        entity:
          domain:
            - valve
            - switch

set_consumption_budget:
  fields:
    liters_per_month:
      example: 5000
      selector:
        number:
          min: 0
          step: 1
          unit_of_measurement: L
          mode: box
    action:
      required: true
      example: notify
      selector:
        select:
          options:
            - notify
            - reduce
            - suspend
    reduce_pct:
      example: 50
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: box

set_restrictions:
  fields:
    forbidden_windows:
      example: '[{"start": "08:00", "end": "10:30"}]'
      selector:
        object:

set_session_limits:
  fields:
    session_max_min:
      example: 120
      selector:
        number: { min: 1, max: 1440, step: 1, unit_of_measurement: min, mode: box }
    must_finish_by:
      example: "06:00"
      selector:
        time:
    wait_free_min:
      example: 5
      selector:
        number: { min: 0, max: 120, step: 1, unit_of_measurement: min, mode: box }
    manual_block_min:
      example: 30
      selector:
        number: { min: 0, max: 1440, step: 1, unit_of_measurement: min, mode: box }
    settle_pause_s:
      example: 60
      selector:
        number: { min: 0, max: 600, step: 1, unit_of_measurement: s, mode: box }
    sentinel_time:
      example: "23:30"
      selector:
        time:

set_valve_safety:
  fields:
    open_confirm_s:
      example: 10
      selector:
        number: { min: 1, max: 300, step: 1, unit_of_measurement: s, mode: box }
    close_confirm_s:
      example: 15
      selector:
        number: { min: 1, max: 300, step: 1, unit_of_measurement: s, mode: box }
    switch_confirm_s:
      example: 8
      selector:
        number: { min: 1, max: 300, step: 1, unit_of_measurement: s, mode: box }
    startup_valve_timeout_s:
      example: 30
      selector:
        number: { min: 1, max: 600, step: 1, unit_of_measurement: s, mode: box }
    watchdog_max_min:
      example: 45
      selector:
        number: { min: 1, max: 1440, step: 1, unit_of_measurement: min, mode: box }

set_concurrency:
  fields:
    max_concurrent:
      example: 1
      selector:
        number: { min: 1, max: 10, step: 1, mode: box }
    compatibility_groups:
      example: drip,lawn
      selector:
        text:
    master_pre_open_s:
      example: 5
      selector:
        number: { min: 0, max: 600, step: 1, unit_of_measurement: s, mode: box }
    master_post_close_s:
      example: 3
      selector:
        number: { min: 0, max: 600, step: 1, unit_of_measurement: s, mode: box }

set_notifications:
  fields:
    event:
      example: completed
      selector:
        select:
          options:
            - completed
            - skipped
            - interrupted
            - cancelled
            - anomaly
            - watchdog
            - sentinel
            - session_overrun
            - consumption_budget
    events:
      example: '["watchdog", "anomaly", "sentinel", "interrupted"]'
      selector:
        select:
          multiple: true
          options:
            - completed
            - skipped
            - interrupted
            - cancelled
            - anomaly
            - watchdog
            - sentinel
            - session_overrun
            - consumption_budget
    enabled:
      example: true
      selector:
        boolean:
    services:
      example: '["mobile_app_pixel_10_pro_xl"]'
      selector:
        object:
    priority:
      example: high
      selector:
        select:
          options:
            - high
            - normal

test_notification:
  fields:
    services:
      required: true
      example: '["mobile_app_pixel_10_pro_xl"]'
      selector:
        object:
    event:
      example: watchdog
      selector:
        select:
          options:
            - completed
            - skipped
            - interrupted
            - cancelled
            - anomaly
            - watchdog
            - sentinel
            - session_overrun
            - consumption_budget
    title:
      example: Irrigation Maestro
      selector:
        text:
    message:
      example: Test notification.
      selector:
        text:

notification_status:

set_program_advanced:
  fields:
    zone_id:
      required: true
      example: 1b2f3c4d5e6f
      selector:
        text:
    program_id:
      required: true
      example: a1b2c3d4
      selector:
        text:
    soak_max_run_min:
      example: 10
      selector:
        number: { min: 1, max: 1440, step: 1, unit_of_measurement: min, mode: box }
    soak_pause_min:
      example: 15
      selector:
        number: { min: 0, max: 1440, step: 1, unit_of_measurement: min, mode: box }
    volume_safety_timeout_min:
      example: 45
      selector:
        number: { min: 1, max: 1440, step: 1, unit_of_measurement: min, mode: box }
