# Field selectors only — names and descriptions live in translations
# ("services" section of translations/*.json).

run_zone:
  fields:
    zone_id:
      required: true
      example: 1b2f3c4d5e6f
      selector:
        text:
    duration:
      example: 15
      selector:
        number:
          min: 1
          max: 1440
          step: 1
          unit_of_measurement: min
          mode: box

run_all:

skip_today:
  fields:
    zone_id:
      example: 1b2f3c4d5e6f
      selector:
        text:

pause:
  fields:
    hours:
      required: true
      example: 6
      selector:
        number:
          min: 0.5
          max: 8760
          step: 0.5
          unit_of_measurement: h
          mode: box
    zone_id:
      example: 1b2f3c4d5e6f
      selector:
        text:

suspend_until:
  fields:
    until:
      required: true
      example: "2026-08-01 06:00:00"
      selector:
        datetime:
    zone_id:
      example: 1b2f3c4d5e6f
      selector:
        text:

resume:
  fields:
    zone_id:
      example: 1b2f3c4d5e6f
      selector:
        text:

stop_all:

evaluate:

set_zone_order:
  fields:
    zone_id:
      required: true
      example: 1b2f3c4d5e6f
      selector:
        text:
    order:
      required: true
      example: 10
      selector:
        number:
          min: 1
          max: 1000
          step: 1
          mode: box

set_curve:
  fields:
    zone_id:
      required: true
      example: 1b2f3c4d5e6f
      selector:
        text:
    cycle_id:
      required: true
      example: a1b2c3d4
      selector:
        text:
    points:
      required: true
      example: "[[10, 5], [25, 15], [35, 30]]"
      selector:
        object:
    min_value:
      example: 5
      selector:
        number:
          min: 0
          max: 10000
          step: 0.1
          mode: box
    max_value:
      example: 55
      selector:
        number:
          min: 0
          max: 10000
          step: 0.1
          mode: box

set_simple_curve:
  fields:
    zone_id:
      required: true
      example: 1b2f3c4d5e6f
      selector:
        text:
    cycle_id:
      required: true
      example: a1b2c3d4
      selector:
        text:
    amount:
      required: true
      example: 15
      selector:
        number:
          min: 3
          max: 45
          step: 1
          mode: slider
          unit_of_measurement: min
    heat:
      required: true
      example: 15
      selector:
        number:
          min: 0
          max: 30
          step: 1
          mode: slider
          unit_of_measurement: min
    min_value:
      example: 8
      selector:
        number:
          min: 0
          max: 10000
          step: 0.1
          mode: box
    max_value:
      example: 35
      selector:
        number:
          min: 0
          max: 10000
          step: 0.1
          mode: box

export_config:

import_config:
  fields:
    payload:
      required: true
      example: '{"options": {}, "zones": {}}'
      selector:
        text:
          multiline: true

set_program_schedule:
  fields:
    zone_id:
      required: true
      example: 1b2f3c4d5e6f
      selector:
        text:
    program_id:
      required: true
      example: a1b2c3d4
      selector:
        text:
    days:
      example: "[0, 2, 4]"
      selector:
        select:
          multiple: true
          options:
            - value: "0"
              label: Mon
            - value: "1"
              label: Tue
            - value: "2"
              label: Wed
            - value: "3"
              label: Thu
            - value: "4"
              label: Fri
            - value: "5"
              label: Sat
            - value: "6"
              label: Sun
    start_kind:
      required: true
      example: sun
      selector:
        select:
          options:
            - time
            - sun
    start_time:
      example: "06:00:00"
      selector:
        time:
    start_event:
      example: sunrise
      selector:
        select:
          options:
            - sunrise
            - sunset
    start_offset_min:
      example: -15
      selector:
        number:
          min: -360
          max: 360
          step: 1
          unit_of_measurement: min
          mode: box

set_program_minutes:
  fields:
    zone_id:
      required: true
      example: 1b2f3c4d5e6f
      selector:
        text:
    program_id:
      required: true
      example: a1b2c3d4
      selector:
        text:
    minutes:
      example: 15
      selector:
        number:
          min: 1
          max: 1440
          step: 1
          unit_of_measurement: min
          mode: box
    day_minutes:
      example: '{"0": 15, "2": 20}'
      selector:
        object:

add_program:
  fields:
    zone_id:
      required: true
      example: 1b2f3c4d5e6f
      selector:
        text:
    name:
      example: Morning
      selector:
        text:
    copy_from:
      example: a1b2c3d4
      selector:
        text:

remove_program:
  fields:
    zone_id:
      required: true
      example: 1b2f3c4d5e6f
      selector:
        text:
    program_id:
      required: true
      example: a1b2c3d4
      selector:
        text:

rename_program:
  fields:
    zone_id:
      required: true
      example: 1b2f3c4d5e6f
      selector:
        text:
    program_id:
      required: true
      example: a1b2c3d4
      selector:
        text:
    name:
      required: true
      example: Morning
      selector:
        text:
